      - ApiUserKeyAuth: *id012
  /alpha/award-recommendations/{award_recommendation_id}/attachments/{award_recommendation_attachment_id}:
    delete:
      parameters:
      - in: path
        name: award_recommendation_id
        schema:
          type: string
        required: true
      - in: path
        name: award_recommendation_attachment_id
        schema:
          type: string
        required: true
