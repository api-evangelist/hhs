apis:
- name: openFDA API
  description: >-
    OpenFDA provides RESTful APIs and raw download access to high-value FDA public datasets including
    drug adverse events, drug labels, drug recalls, medical device 510(k) clearances, device classifications,
    device recalls, and food recall enforcement reports. Free API key available for higher rate limits.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://open.fda.gov/apis/
  baseURL: https://api.fda.gov
  tags:
  - FDA
  - Drugs
  - Medical Devices
  - Food Safety
  - Adverse Events
  - Recalls
  properties:
  - type: Documentation
    url: https://open.fda.gov/apis/
  - type: Authentication
    url: https://open.fda.gov/apis/authentication/
  - type: RateLimits
    url: rate-limits/openfda.yml
  - type: Plans
    url: plans/openfda.yml
  contact:
  - FN: openFDA Team
    url: https://open.fda.gov/contact/
- name: MyHealthfinder API
  description: >-
    The MyHealthfinder API (Version 4) allows developers to add evidence-based, plain language health
    content to their websites and applications. Content is available in English and Spanish and is completely
    free to use. Provides personalized health recommendations based on age, sex, and pregnancy status.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://odphp.health.gov/our-work/national-health-initiatives/health-literacy/consumer-health-content/free-web-content/apis-developers
  baseURL: https://health.gov/myhealthfinder
  tags:
  - Public Health
  - Health Content
  - Consumer Health
  - ODPHP
  properties:
  - type: Documentation
    url: >-
      https://odphp.health.gov/our-work/national-health-initiatives/health-literacy/consumer-health-content/free-web-content/apis-developers/api-documentation
  contact:
  - FN: ODPHP
    url: https://odphp.health.gov/
- name: ONC Health IT Open Data API
  description: >-
    The ONC Health IT Open Data API provides access to open datasets published by the Office of the National
    Coordinator for Health Information Technology. Supports filtering by state and year, and returns data
    in JSON, CSV, or XML formats. Covers datasets on EHR adoption, health IT use, and interoperability
    metrics.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://healthit.gov/data/api/
  baseURL: https://healthit.gov/data/open-api
  tags:
  - Health IT
  - EHR
  - Interoperability
  - ONC
  - Open Data
  properties:
  - type: Documentation
    url: https://healthit.gov/data/api/
  contact:
  - FN: ONC
    email: ONC.Request@hhs.gov
    url: https://healthit.gov/
- name: HRSA Health Center Data Web Service
  description: >-
    The HRSA Health Center Data Web Service allows querying for federally qualified health centers by
    state, county, or ZIP code. A separate service provides access to Ryan White HIV/AIDS Medical Care
    Providers searchable by latitude and longitude. Uses SOAP/XML. Registration required to obtain a web
    token.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://data.hrsa.gov/data/services
  baseURL: https://data.hrsa.gov
  tags:
  - HRSA
  - Health Centers
  - HIV/AIDS
  - Provider Locator
  - SOAP
  properties:
  - type: Documentation
    url: https://data.hrsa.gov/data/services
  contact:
  - FN: HRSA Data
    email: data@hrsa.gov
    url: https://data.hrsa.gov/
- name: HealthData.gov Catalog API
  description: >-
    The HealthData.gov Catalog API uses CKAN and provides machine-readable access to the HHS health data
    catalog. Developers can find newly added datasets, search the catalog, download catalog metadata for
    analysis, or build new catalog tools. Conforms to DCAT-US 3.0 standards.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://healthdata.gov/
  baseURL: https://healthdata.gov/api/3
  tags:
  - Open Data
  - CKAN
  - Health Data
  - Data Catalog
  - DCAT
  properties:
  - type: Documentation
    url: https://healthdata.gov/
  contact:
  - FN: HealthData.gov
    url: https://healthdata.gov/
